<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionale Giorgio PRO</title>
<meta name="theme-color" content="#1e3c72">

<style>
:root{
--blue:#1e3c72;
--bg:#f4f6fb;
--card:#ffffff;
--border:#e5e7eb;
--radius:14px;
--shadow:0 8px 20px rgba(0,0,0,0.06);
}

body{
margin:0;
font-family:Arial, sans-serif;
background:var(--bg);
}

header{
background:var(--blue);
color:white;
padding:15px;
text-align:center;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
padding:10px;
background:white;
border-bottom:1px solid var(--border);
}

.tabs button{
padding:10px 14px;
border:none;
border-radius:8px;
background:#e0e6f5;
cursor:pointer;
font-weight:bold;
}

.tabs button.active{
background:var(--blue);
color:white;
}

.section{
display:none;
max-width:1000px;
margin:auto;
padding:20px;
}

.section.active{
display:block;
}

.panel{
background:var(--card);
padding:15px;
border-radius:var(--radius);
box-shadow:var(--shadow);
margin-bottom:15px;
}

input, textarea, select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
}

button.primary{
background:var(--blue);
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.card{
background:white;
padding:12px;
border-radius:12px;
border:1px solid var(--border);
margin-top:10px;
}

.kpi{
display:inline-block;
padding:10px 15px;
background:white;
border-radius:12px;
border:1px solid var(--border);
margin:5px;
font-weight:bold;
}
</style>
</head>

<body>

<header>Gestionale Giorgio PRO</header>

<div class="tabs">
<button id="tabPrev" class="active" onclick="show('preventivi')">Preventivi</button>
<button id="tabRic" onclick="show('ricevute')">Ricevute</button>
<button id="tabStats" onclick="show('statistiche')">Statistiche</button>
</div>

<div id="preventivi" class="section active">

<div class="panel">
<h3>Nuovo Preventivo</h3>
<input id="pCliente" placeholder="Cliente">
<textarea id="pDesc" placeholder="Descrizione lavori"></textarea>
<input id="pManodopera" type="number" placeholder="Manodopera €">
<input id="pMateriali" type="number" placeholder="Materiali €">
<select id="pStato">
<option>In attesa</option>
<option>Accettato</option>
<option>Rifiutato</option>
</select>
<button class="primary" onclick="salvaPreventivo()">Salva</button>
</div>

<div class="panel">
<h3>Lista Preventivi</h3>
<div id="listaPreventivi"></div>
</div>

</div>

<div id="ricevute" class="section">

<div class="panel">
<h3>Nuova Ricevuta</h3>
<input id="rCliente" placeholder="Cliente">
<textarea id="rDesc" placeholder="Descrizione intervento"></textarea>
<input id="rManodopera" type="number" placeholder="Manodopera €">
<input id="rMateriali" type="number" placeholder="Materiali €">
<select id="rPagamento">
<option>Contanti</option>
<option>Bonifico</option>
<option>POS</option>
</select>
<button class="primary" onclick="salvaRicevuta()">Genera</button>
</div>

<div class="panel">
<h3>Lista Ricevute</h3>
<div id="listaRicevute"></div>
</div>

</div>

<div id="statistiche" class="section">

<div class="panel">
<h3>Statistiche</h3>
<div class="kpi">Totale mese: € <span id="totMese">0</span></div>
<div class="kpi">Totale anno: € <span id="totAnno">0</span></div>
<div class="kpi">Media intervento: € <span id="media">0</span></div>
</div>

</div>

<script>

let preventivi = JSON.parse(localStorage.getItem("gg_prev")) || [];
let ricevute = JSON.parse(localStorage.getItem("gg_ric")) || [];

function show(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
document.getElementById("tab"+id.charAt(0).toUpperCase()+id.slice(1,3)).classList.add("active");
}

function salvaPreventivo(){
let p = {
cliente:pCliente.value,
desc:pDesc.value,
manodopera:Number(pManodopera.value||0),
materiali:Number(pMateriali.value||0),
stato:pStato.value,
data:new Date().toISOString()
};
preventivi.push(p);
localStorage.setItem("gg_prev",JSON.stringify(preventivi));
renderPreventivi();
pCliente.value="";pDesc.value="";pManodopera.value="";pMateriali.value="";
}

function salvaRicevuta(){
let r = {
cliente:rCliente.value,
desc:rDesc.value,
manodopera:Number(rManodopera.value||0),
materiali:Number(rMateriali.value||0),
pagamento:rPagamento.value,
data:new Date().toISOString()
};
ricevute.push(r);
localStorage.setItem("gg_ric",JSON.stringify(ricevute));
renderRicevute();
calcolaStatistiche();
rCliente.value="";rDesc.value="";rManodopera.value="";rMateriali.value="";
}

function renderPreventivi(){
listaPreventivi.innerHTML="";
preventivi.forEach(p=>{
let tot = p.manodopera + p.materiali;
listaPreventivi.innerHTML+=`<div class="card">
<b>${p.cliente}</b><br>
€ ${tot} (${p.stato})
</div>`;
});
}

function renderRicevute(){
listaRicevute.innerHTML="";
ricevute.forEach(r=>{
let tot = r.manodopera + r.materiali;
listaRicevute.innerHTML+=`<div class="card">
<b>${r.cliente}</b><br>
€ ${tot} - ${r.pagamento}
</div>`;
});
}

function calcolaStatistiche(){
let now = new Date();
let mese = now.getMonth();
let anno = now.getFullYear();

let totMese=0;
let totAnno=0;

ricevute.forEach(r=>{
let d=new Date(r.data);
let tot=r.manodopera+r.materiali;
if(d.getFullYear()==anno) totAnno+=tot;
if(d.getFullYear()==anno && d.getMonth()==mese) totMese+=tot;
});

let media = ricevute.length ? (totAnno/ricevute.length) : 0;

totMese.innerText=totMese.toFixed(2);
totAnno.innerText=totAnno.toFixed(2);
media.innerText=media.toFixed(2);
}

renderPreventivi();
renderRicevute();
calcolaStatistiche();

</script>

</body>
</html>
